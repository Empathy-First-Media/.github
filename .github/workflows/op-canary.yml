# Vendor-only canary. No custom shell. Failure is the action's own failure.
# Pin: 1password/load-secrets-action v5.0.1
name: op-canary
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Load canary secret from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_SA_CANARY: ${{ secrets.OP_SA_CANARY_REF }}
