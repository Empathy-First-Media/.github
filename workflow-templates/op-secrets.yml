# Caller for the central 1Password canary. Logic lives in
# Empathy-First-Media/.github (op-canary.yml); this file only schedules it.
name: op-secrets-smoke
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 14 * * 1'
permissions:
  contents: read
concurrency:
  group: op-secrets-smoke
  cancel-in-progress: false
jobs:
  canary:
    uses: Empathy-First-Media/.github/.github/workflows/op-canary.yml@4cccef1720b7af877719a89647873de839c71b5a
    secrets: inherit
