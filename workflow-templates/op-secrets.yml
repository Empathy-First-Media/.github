# 1Password -> GitHub Actions smoke test.
# Vendor-native: 1password/load-secrets-action pinned to full SHA (GitHub
# Secure Use guidance); Dependabot github-actions bumps SHA + comment.
# Auth: ONE org secret OP_SERVICE_ACCOUNT_TOKEN (dedicated GitHub Actions
# service account, read-only). Canary: dedicated item, ref in org secret
# OP_SA_CANARY_REF. Verified 2026-10-14, load-secrets-action v5.0.1.
name: 1Password Secrets Smoke Test
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 14 * * 1'
permissions:
  contents: read
concurrency:
  group: op-secrets-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load canary secret from 1Password
        id: op_canary
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_SA_CANARY: ${{ secrets.OP_SA_CANARY_REF }}
      - name: Verify canary loaded (value never printed)
        env:
          CANARY_VALUE: ${{ steps.op_canary.outputs.OP_SA_CANARY }}
        run: |
          if [ -z "${CANARY_VALUE:-}" ]; then
            echo "::error::Canary secret resolved empty. Check OP_SERVICE_ACCOUNT_TOKEN + OP_SA_CANARY_REF."
            exit 1
          fi
          echo "1Password load OK: canary non-empty (length ${#CANARY_VALUE}, value masked by GitHub)."
