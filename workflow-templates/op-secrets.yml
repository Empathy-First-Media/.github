# Caller only. Logic is Empathy-First-Media/.github op-canary.yml.
name: op-secrets-smoke
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 14 * * 1'
permissions:
  contents: read
concurrency:
  group: op-secrets-smoke
  cancel-in-progress: false
jobs:
  canary:
    uses: Empathy-First-Media/.github/.github/workflows/op-canary.yml@7a7a2f9573fd2e86da775780bce528c7ec6ea2bd
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      OP_SA_CANARY_REF: ${{ secrets.OP_SA_CANARY_REF }}
