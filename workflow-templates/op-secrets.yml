# 1Password -> GitHub Actions smoke test (dispatch-only).
# Pattern: ONE bootstrap secret (OP_SERVICE_ACCOUNT_TOKEN, dedicated
# GitHub Actions service account, read-only) + op:// refs loaded live via
# 1password/load-secrets-action. Rotate in 1Password; never copy values
# into GitHub secrets. OP_SA_CANARY_REF holds an op:// ref (not a value)
# proving item-read. Verified 2026-10-14, load-secrets-action v5.
name: 1Password Secrets Smoke Test
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load canary secret from 1Password
        id: op_canary
        uses: 1password/load-secrets-action@v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_SA_CANARY: ${{ secrets.OP_SA_CANARY_REF }}
      - name: Verify canary loaded (value never printed)
        env:
          CANARY_VALUE: ${{ steps.op_canary.outputs.OP_SA_CANARY }}
        run: |
          if [ -z "${CANARY_VALUE:-}" ]; then
            echo "::error::Canary secret resolved empty. Check OP_SERVICE_ACCOUNT_TOKEN + OP_SA_CANARY_REF."
            exit 1
          fi
          echo "1Password load OK: canary non-empty (length ${#CANARY_VALUE}, value masked by GitHub)."
