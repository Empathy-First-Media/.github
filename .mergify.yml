# Staging only: no queue rules, merge actions, or automatic admission.
# Keep the existing GitHub review requirement until live tampering tests pass.
merge_protections_settings:
  reporting_method: check-runs
  post_comment: true

merge_protections:
  - name: Successful authoritative CI
    if:
      - repository-name = universal-systems
      - base = main
    success_conditions:
      - check-success = @github-actions/ci-gate

  - name: Preserve the shared policy loader
    if:
      - repository-name = universal-systems
      - base = main
    success_conditions:
      - '-mergify-configuration-changed'
      - '-files ~= ^(\.mergify(\.ya?ml$|/)|\.github/mergify\.ya?ml$)'

  - name: Conservative CI control-change review
    if:
      - repository-name = universal-systems
      - base = main
      - 'files ~= ^(\.github/|\.circleci/|mise/|mise\.(toml|lock)$|package\.json$|pnpm-(lock|workspace)\.yaml$|pyproject\.toml$|uv\.lock$|biome\.jsonc?$|tsconfig[^/]*\.json$|tests/canary/|packages/universal-systems-contracts/(pyproject\.toml|uv\.lock)$|services/ecosystem-catalog/registry/(actions|workflows)\.yaml$)'
    success_conditions:
      - approved-reviews-by = dlynch90
